# Throwaway probe, third pass: Safari on macOS and in the iOS simulator,
# through safaridriver, on the macOS 26 image and on the macOS 27 one.
name: stock browsers probe

on:
  push:
    branches: [ "probe/stock-browsers" ]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: xcode-27, browser: safari-ios, ios: '27' }
    name: ${{ matrix.os }} ${{ matrix.browser }} ${{ matrix.ios }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      WTR_BROWSERS: ${{ matrix.browser }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        check-latest: true
    - run: yarn install
    - timeout-minutes: 5
      run: |
        sw_vers
        defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString
        sudo safaridriver --enable
    - if: matrix.ios
      timeout-minutes: 15
      run: |
        xcrun simctl list runtimes
        runtime=$(xcrun simctl list runtimes -j | jq -r --arg v "${{ matrix.ios }}" \
          '.runtimes[] | select(.platform == "iOS" and .isAvailable and (.version | startswith($v))) | "\(.version) \(.identifier)"' \
          | sort -V | tail -1 | cut -d' ' -f2)
        udid=$(xcrun simctl list devices available -j | jq -r --arg r "$runtime" \
          '.devices[$r][] | select(.name | startswith("iPhone")) | .udid' | head -1)
        echo "runtime=$runtime udid=$udid"
        xcrun simctl list devices available -j | jq -r --arg r "$runtime" '.devices[$r][] | "\(.name) \(.udid)"'
        xcrun simctl boot "$udid"
        xcrun simctl bootstatus "$udid"
        # Settings > Safari > Advanced > Remote Automation, which safaridriver needs.
        for domain in com.apple.webinspectord com.apple.mobilesafari; do
          xcrun simctl spawn "$udid" defaults write "$domain" RemoteAutomationEnabled -bool YES
        done
        open -a "$(xcode-select -p)/Applications/Simulator.app" --args -CurrentDeviceUDID "$udid" || echo "no Simulator.app"
        xcrun simctl launch "$udid" com.apple.mobilesafari
        sleep 30
        xcrun simctl terminate "$udid" com.apple.mobilesafari || true
        echo "WTR_START_MS=300000" >> "$GITHUB_ENV"
        echo "IOS_UDID=$udid" >> "$GITHUB_ENV"
    - name: Capabilities
      timeout-minutes: 15
      run: |
        WTR_FILES=test/probe-capabilities.test.js yarn test 2>&1 | tee probe-capabilities.log
        grep -q '"opfs":"ok"' probe-capabilities.log && echo "OPFS_OK=1" >> "$GITHUB_ENV" || echo "OPFS not available, suite skipped"
    - if: env.OPFS_OK == '1'
      name: Test with checked-in WASM files
      run: yarn test
      env:
        WTR_TRACE: '1'
        WDIO_LOG_LEVEL: info
        WDIO_OUTPUT_DIR: probe/wdio-logs
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ matrix.os }}-${{ matrix.browser }}
        path: |
          probe-capabilities.log
          probe/wdio-logs
          ~/Library/Logs/com.apple.WebDriver
        if-no-files-found: ignore
