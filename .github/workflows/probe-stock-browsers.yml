# Throwaway probe, third pass: Safari on macOS and in the iOS simulator,
# through safaridriver, on the macOS 26 image and on the macOS 27 one.
name: stock browsers probe

on:
  push:
    branches: [ "probe/stock-browsers" ]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: macos-26, browser: safari, attempt: 1, files: test/sql.test.js }
        - { os: macos-26, browser: safari, attempt: 2, files: test/sql.test.js }
    name: ${{ matrix.os }} ${{ matrix.browser }} ${{ matrix.ios }} ${{ matrix.attempt }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      WTR_BROWSERS: ${{ matrix.browser }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        check-latest: true
    - run: yarn install
    - if: runner.os == 'macOS'
      timeout-minutes: 5
      run: |
        sw_vers
        defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString
        sudo safaridriver --enable
    - if: matrix.ios
      timeout-minutes: 15
      run: |
        xcrun simctl list runtimes
        runtime=$(xcrun simctl list runtimes -j | jq -r --arg v "${{ matrix.ios }}" \
          '.runtimes[] | select(.platform == "iOS" and .isAvailable and (.version | startswith($v))) | "\(.version) \(.identifier)"' \
          | sort -V | tail -1 | cut -d' ' -f2)
        udid=$(xcrun simctl list devices available -j | jq -r --arg r "$runtime" \
          '.devices[$r][] | select(.name | startswith("iPhone")) | .udid' | head -1)
        echo "runtime=$runtime udid=$udid"
        xcrun simctl list devices available -j | jq -r --arg r "$runtime" '.devices[$r][] | "\(.name) \(.udid)"'
        xcrun simctl boot "$udid"
        xcrun simctl bootstatus "$udid"
        # Settings > Safari > Advanced > Remote Automation, which safaridriver needs.
        for domain in com.apple.webinspectord com.apple.mobilesafari; do
          xcrun simctl spawn "$udid" defaults write "$domain" RemoteAutomationEnabled -bool YES
        done
        open -b com.apple.dt.Devices || open -a "$(xcode-select -p)/Applications/Simulator.app" --args -CurrentDeviceUDID "$udid" || echo "neither Device Hub nor Simulator.app"
        sleep 10
        xcrun simctl launch "$udid" com.apple.mobilesafari
        sleep 30
        xcrun simctl terminate "$udid" com.apple.mobilesafari || true
        echo "WTR_START_MS=300000" >> "$GITHUB_ENV"
        echo "IOS_UDID=$udid" >> "$GITHUB_ENV"
    - if: matrix.ios
      name: safaridriver diagnosis
      timeout-minutes: 10
      run: |
        safaridriver --version
        xcrun simctl list devices booted
        safaridriver -p 4444 --diagnose &
        sleep 3
        for caps in \
          '{"platformName":"iOS","browserName":"safari","safari:useSimulator":true}' \
          "{\"platformName\":\"iOS\",\"browserName\":\"safari\",\"safari:useSimulator\":true,\"safari:deviceUDID\":\"$IOS_UDID\"}" \
          '{"platformName":"iOS","browserName":"safari"}'; do
          echo "== $caps"
          resp=$(curl -s -m 120 -X POST localhost:4444/session -d "{\"capabilities\":{\"alwaysMatch\":$caps}}")
          echo "$resp"
          sid=$(echo "$resp" | jq -r '.value.sessionId // empty')
          [ -n "$sid" ] && curl -s -X DELETE "localhost:4444/session/$sid" && echo
        done
        kill %1 || true
        ls -la ~/Library/Logs/com.apple.WebDriver/ || true
        tail -n 80 ~/Library/Logs/com.apple.WebDriver/* 2>/dev/null || true
    - if: runner.os == 'macOS'
      run: touch "$RUNNER_TEMP/crash-marker"
    - name: Capabilities
      timeout-minutes: 15
      run: |
        WTR_FILES=test/probe-capabilities.test.js yarn test 2>&1 | tee probe-capabilities.log
        grep -q '"opfs":"ok"' probe-capabilities.log && echo "OPFS_OK=1" >> "$GITHUB_ENV" || echo "OPFS not available, suite skipped"
    - if: env.OPFS_OK == '1'
      name: Test with checked-in WASM files
      run: yarn test
      env:
        WTR_FILES: ${{ matrix.files }}
        WTR_TRACE: '1'
        WDIO_LOG_LEVEL: info
        WDIO_OUTPUT_DIR: probe/wdio-logs
    - if: always() && runner.os == 'macOS'
      name: Crash reports
      run: |
        mkdir -p probe/crash
        for dir in ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports; do
          sudo find "$dir" -type f -newer "$RUNNER_TEMP/crash-marker" 2>/dev/null
        done | while read -r f; do
          echo "=== $f"
          sudo cp "$f" probe/crash/ && sudo chmod a+r "probe/crash/$(basename "$f")"
          sudo head -c 6000 "$f"; echo
        done
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ matrix.os }}-${{ matrix.browser }}-${{ matrix.attempt }}
        path: |
          probe-capabilities.log
          probe/wdio-logs
          ~/Library/Logs/com.apple.WebDriver
          probe/crash
        if-no-files-found: ignore
