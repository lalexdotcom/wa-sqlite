# Throwaway probe, second pass: Firefox on Windows one file at a time, to
# name the file that hangs; Firefox on Linux five times, to measure how
# often the WebDriver launcher loses a file.
name: stock browsers probe

on:
  push:
    branches: [ "probe/stock-browsers" ]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: windows-latest, browser: firefox, mode: per-file, attempt: 1 }
        - { os: ubuntu-latest, browser: firefox, mode: suite, attempt: 1 }
        - { os: ubuntu-latest, browser: firefox, mode: suite, attempt: 2 }
        - { os: ubuntu-latest, browser: firefox, mode: suite, attempt: 3 }
        - { os: ubuntu-latest, browser: firefox, mode: suite, attempt: 4 }
        - { os: ubuntu-latest, browser: firefox, mode: suite, attempt: 5 }
    name: ${{ matrix.os }} ${{ matrix.browser }} ${{ matrix.mode }} ${{ matrix.attempt }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      WTR_BROWSERS: ${{ matrix.browser }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - run: yarn install
    - if: runner.os == 'Windows' && matrix.browser == 'firefox'
      run: |
        driver=$(command -v geckodriver || ls /c/SeleniumWebDrivers/GeckoDriver/geckodriver.exe)
        echo "GECKODRIVER_PATH=$(cygpath -w "$driver")" | tee -a "$GITHUB_ENV"
    - if: matrix.mode == 'per-file'
      run: probe/per-file.sh
    - if: matrix.mode == 'suite'
      run: yarn test
      env:
        WDIO_LOG_LEVEL: info
        WDIO_OUTPUT_DIR: probe/wdio-logs
    - if: always()
      uses: actions/upload-artifact@v4
      with:
        name: logs-${{ matrix.os }}-${{ matrix.browser }}-${{ matrix.mode }}-${{ matrix.attempt }}
        path: |
          probe/logs
          probe/wdio-logs
        if-no-files-found: ignore
